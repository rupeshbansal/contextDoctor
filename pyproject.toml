[project]
name = "context-profiler"
version = "0.1.0"
description = "Profile token usage across a conversation to see what's eating your context window."
requires-python = ">=3.9"
dependencies = [
    "tiktoken>=0.7.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
context-profiler = "context_profiler.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["context_profiler*"]
